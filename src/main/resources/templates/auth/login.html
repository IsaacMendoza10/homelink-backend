<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ingresar - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container" style="max-width: 480px;">
    <h1 class="h3 mb-3">Ingresar</h1>
    <p th:if="${error}" class="alert alert-danger" th:text="${error}"></p>
    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label">Correo electronico</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
    <p class="mt-3">Admin de prueba: admin@homelink.com / admin123</p>
</main>
</body>
</html>
