<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de trabajador - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container" style="max-width: 480px;">
    <h1 class="h3 mb-3">Registro como trabajador independiente</h1>
    <p th:if="${error}" class="alert alert-danger" th:text="${error}"></p>
    <form method="post" th:action="@{/registro-trabajador}">
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo electronico</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Telefono</label>
            <input type="text" name="telefono" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
    </form>
    <p class="text-muted mt-2">Despues de registrarte, completa tu perfil profesional y espera la aprobacion del administrador.</p>
</main>
</body>
</html>
