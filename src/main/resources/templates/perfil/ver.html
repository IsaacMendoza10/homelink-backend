<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3">Mi perfil profesional</h1>
    <div th:if="${perfil == null}" class="alert alert-warning">
        No se encontro un perfil de trabajador para esta cuenta. Debes registrarte como trabajador.
    </div>
    <div th:if="${perfil != null}">
        <p>Estado de aprobacion:
            <span class="badge bg-secondary" th:text="${perfil.estadoAprobacion}"></span>
        </p>
        <form method="post" th:action="@{/perfil/actualizar}">
            <div class="mb-3">
                <label class="form-label">Categoria</label>
                <select name="categoriaId" class="form-select">
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                            th:selected="${perfil.categoria != null and perfil.categoria.id == c.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Zona de cobertura</label>
                <input type="text" name="zonaCobertura" class="form-control" th:value="${perfil.zonaCobertura}">
            </div>
            <div class="mb-3">
                <label class="form-label">Descripcion</label>
                <textarea name="descripcion" class="form-control" th:text="${perfil.descripcion}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Tarifa referencial (COP/hora)</label>
                <input type="number" step="0.01" name="tarifaReferencial" class="form-control" th:value="${perfil.tarifaReferencial}">
            </div>
            <div class="mb-3">
                <label class="form-label">URL documento de validacion</label>
                <input type="text" name="documentoUrl" class="form-control" th:value="${perfil.documentoUrl}">
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </div>
</main>
</body>
</html>
