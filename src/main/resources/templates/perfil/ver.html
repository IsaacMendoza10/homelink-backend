<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3">Mi perfil profesional</h1>
    <p th:if="${error}" class="alert alert-danger" th:text="${error}"></p>
    <div th:if="${perfil == null}" class="alert alert-warning">
        No se encontro un perfil de trabajador para esta cuenta. Debes registrarte como trabajador.
    </div>
    <div th:if="${perfil != null}">
        <p>Estado de aprobacion:
            <span class="badge bg-secondary" th:text="${perfil.estadoAprobacion}"></span>
        </p>
        <form method="post" th:action="@{/perfil/actualizar}">
            <div class="mb-3">
                <label class="form-label">Zona de cobertura</label>
                <input type="text" name="zonaCobertura" class="form-control" th:value="${perfil.zonaCobertura}">
            </div>
            <div class="mb-3">
                <label class="form-label">Descripcion</label>
                <textarea name="descripcion" class="form-control" th:text="${perfil.descripcion}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">URL documento de validacion</label>
                <input type="text" name="documentoUrl" class="form-control" th:value="${perfil.documentoUrl}">
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>

        <hr class="my-4">
        <h2 class="h5 mb-3">Tus categorias y tarifas</h2>
        <p th:if="${#lists.isEmpty(misCategorias)}" class="text-muted">
            Aun no ofreces ninguna categoria. Agrega al menos una para que los clientes puedan encontrarte.
        </p>
        <table th:if="${!#lists.isEmpty(misCategorias)}" class="table">
            <thead>
            <tr>
                <th>Categoria</th>
                <th>Tarifa (COP/hora)</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tc : ${misCategorias}">
                <td th:text="${tc.categoria.nombre}"></td>
                <td th:text="${tc.tarifa}"></td>
                <td>
                    <form method="post" th:action="@{/perfil/categorias/{id}/eliminar(id=${tc.id})}" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Quitar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <form method="post" th:action="@{/perfil/categorias/agregar}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">Agregar categoria</label>
                <select name="categoriaId" class="form-select" required>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label">Tarifa (COP/hora)</label>
                <input type="number" step="0.01" name="tarifa" class="form-control" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Agregar</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
