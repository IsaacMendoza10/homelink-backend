<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar trabajadores - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-3">Buscar trabajadores</h1>
    <form method="get" th:action="@{/trabajadores}" class="row g-2 mb-4">
        <div class="col-auto">
            <select name="categoriaId" class="form-select">
                <option value="">Selecciona una categoria</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>

    <div th:if="${trabajadores != null}">
        <div class="card mb-2" th:each="t : ${trabajadores}">
            <div class="card-body">
                <h5 class="card-title" th:text="${t.usuario.nombre}"></h5>
                <p class="card-text" th:text="${t.descripcion}"></p>
                <p class="card-text"><small class="text-muted" th:text="'Zona: ' + ${t.zonaCobertura}"></small></p>
                <p class="card-text"><small class="text-muted" th:text="'Tarifa referencial: ' + ${t.tarifaReferencial}"></small></p>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(trabajadores)}">No hay trabajadores aprobados en esta categoria todavia.</p>
    </div>
</main>
</body>
</html>
