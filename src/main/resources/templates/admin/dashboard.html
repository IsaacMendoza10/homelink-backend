<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de administracion - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-3">Trabajadores pendientes de aprobacion</h1>
    <table class="table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Categoria</th>
            <th>Zona</th>
            <th>Documento</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pendientes}">
            <td th:text="${p.usuario.nombre}"></td>
            <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}"></td>
            <td th:text="${p.zonaCobertura}"></td>
            <td><a th:if="${p.documentoUrl}" th:href="${p.documentoUrl}" target="_blank">Ver</a></td>
            <td>
                <form method="post" th:action="@{/admin/trabajadores/{id}/aprobar(id=${p.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-success">Aprobar</button>
                </form>
                <form method="post" th:action="@{/admin/trabajadores/{id}/rechazar(id=${p.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger">Rechazar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
