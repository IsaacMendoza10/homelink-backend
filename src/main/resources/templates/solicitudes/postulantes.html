<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Postulantes - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-1">Postulantes</h1>
    <p class="text-muted" th:text="${solicitud.descripcion}"></p>
    <p th:if="${#lists.isEmpty(postulantes)}" class="text-muted">Todavia no tienes postulantes en esta solicitud.</p>
    <table th:if="${!#lists.isEmpty(postulantes)}" class="table">
        <thead>
        <tr>
            <th>Trabajador</th>
            <th>Origen</th>
            <th>Estado</th>
            <th>Tiempo restante</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${postulantes}">
            <td th:text="${v.postulacion.trabajador.nombre}"></td>
            <td th:text="${v.postulacion.origen.name() == 'TRABAJADOR' ? 'Se postulo' : 'Invitado por ti'}"></td>
            <td th:text="${v.postulacion.estado}"></td>
            <td th:text="${v.tiempoRestanteTexto}"></td>
            <td>
                <form th:if="${v.postulacion.estado.name() == 'ENVIADA'}" method="post"
                      th:action="@{/solicitudes/postulaciones/{id}/aceptar(id=${v.postulacion.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-primary">Aceptar</button>
                </form>
                <form th:if="${v.postulacion.estado.name() == 'ENVIADA'}" method="post"
                      th:action="@{/solicitudes/postulaciones/{id}/rechazar(id=${v.postulacion.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Rechazar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/solicitudes" class="btn btn-outline-secondary btn-sm mt-2">Volver a mis solicitudes</a>
</main>
</body>
</html>
