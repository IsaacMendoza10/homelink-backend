<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva solicitud - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container" style="max-width: 560px;">
    <h1 class="h3 mb-3">Nueva solicitud de servicio</h1>
    <form method="post" th:action="@{/solicitudes/nueva}">
        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select name="categoriaId" class="form-select" required>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripcion del problema</label>
            <textarea name="descripcion" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Direccion</label>
            <input type="text" name="direccion" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Enviar solicitud</button>
    </form>
</main>
</body>
</html>
