<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Elegir trabajador - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-3">Elige un trabajador</h1>
    <p th:if="${#lists.isEmpty(trabajadores)}" class="text-muted">
        No hay trabajadores aprobados en esta categoria todavia. Puedes volver y publicar una solicitud abierta.
    </p>
    <div class="row g-3">
        <div class="col-md-6" th:each="p : ${trabajadores}">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5" th:text="${p.perfilTrabajador.usuario.nombre}"></h2>
                    <p class="mb-1" th:text="${p.perfilTrabajador.descripcion}"></p>
                    <p class="text-muted mb-1" th:text="'Zona: ' + ${p.perfilTrabajador.zonaCobertura}"></p>
                    <p class="text-muted mb-3" th:text="'Tarifa: ' + ${p.tarifa}"></p>
                    <form method="post" th:action="@{/solicitudes/nueva/directa}">
                        <input type="hidden" name="categoriaId" th:value="${categoriaId}">
                        <input type="hidden" name="descripcion" th:value="${descripcion}">
                        <input type="hidden" name="direccion" th:value="${direccion}">
                        <input type="hidden" name="trabajadorId" th:value="${p.perfilTrabajador.usuario.id}">
                        <button type="submit" class="btn btn-primary btn-sm">Elegir a este trabajador</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
