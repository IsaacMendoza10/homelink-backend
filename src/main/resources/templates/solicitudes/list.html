<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis solicitudes - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Mis solicitudes</h1>
        <a th:if="${rol == 'CLIENTE'}" class="btn btn-primary" href="/solicitudes/nueva">Nueva solicitud</a>
    </div>
    <table class="table">
        <thead>
        <tr>
            <th>Categoria</th>
            <th>Descripcion</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${solicitudes}">
            <td th:text="${s.categoria.nombre}"></td>
            <td th:text="${s.descripcion}"></td>
            <td th:text="${s.estado}"></td>
            <td th:text="${s.fechaCreacion}"></td>
            <td>
                <form th:if="${rol == 'TRABAJADOR' and s.estado.name() == 'PENDIENTE'}" method="post"
                      th:action="@{/solicitudes/{id}/aceptar(id=${s.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-primary">Aceptar</button>
                </form>
                <form th:if="${rol == 'TRABAJADOR' and s.estado.name() == 'ACEPTADA'}" method="post"
                      th:action="@{/solicitudes/{id}/finalizar(id=${s.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-success">Finalizar</button>
                </form>
                <form th:if="${rol == 'CLIENTE' and s.estado.name() == 'PENDIENTE'}" method="post"
                      th:action="@{/solicitudes/{id}/cancelar(id=${s.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
