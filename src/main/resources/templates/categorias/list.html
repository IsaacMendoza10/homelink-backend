<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias - HomeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-3">Categorias de servicio</h1>
    <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="c : ${categorias}">
            <div>
                <strong th:text="${c.nombre}"></strong> - <span th:text="${c.descripcion}"></span>
            </div>
            <form method="post" th:action="@{/categorias/{id}/eliminar(id=${c.id})}">
                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
        </li>
    </ul>

    <h2 class="h5">Agregar categoria (solo administrador)</h2>
    <form method="post" th:action="@{/categorias/nueva}" class="row g-2">
        <div class="col-auto">
            <input type="text" name="nombre" placeholder="Nombre" class="form-control" required>
        </div>
        <div class="col-auto">
            <input type="text" name="descripcion" placeholder="Descripcion" class="form-control">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
    </form>
</main>
</body>
</html>
