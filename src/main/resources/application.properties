# Configuracion de base de datos.
# Las credenciales NO se hardcodean: se leen de variables de entorno DB_USERNAME/DB_PASSWORD,
# con "root" como valor por defecto solo para que siga funcionando igual en desarrollo local
# si no defines esas variables. En CI/CD (GitHub Actions) este perfil no se usa: las pruebas
# corren contra H2 en memoria (ver src/test/resources/application.properties).
spring.datasource.url=jdbc:mysql://localhost:3306/homelink_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080

spring.application.name=homelink-backend
