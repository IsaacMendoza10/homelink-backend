# Configuracion exclusiva para pruebas automatizadas.
# Spring Boot usa este archivo en lugar de src/main/resources/application.properties
# cuando corre desde src/test/java, asi que las pruebas nunca dependen de un MySQL real
# (ni local ni en el runner de GitHub Actions).
spring.datasource.url=jdbc:h2:mem:homelink_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
